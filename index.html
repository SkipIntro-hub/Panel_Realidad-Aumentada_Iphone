<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Tales — AR Viewer</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #111;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 1.2rem;
            padding: 1rem;
            text-align: center;
            opacity: 0.8;
        }
        model-viewer {
            width: 100%;
            max-width: 600px;
            height: 70vh;
            background-color: #1a1a1a;
            --poster-color: #1a1a1a;
        }
        .instructions {
            padding: 1rem;
            text-align: center;
            font-size: 0.9rem;
            opacity: 0.6;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <h1>Panel Tales Truck — AR Viewer</h1>
    
    <model-viewer
        src="pt-truck-full-hires.glb"
        ios-src="pt-truck-full-hires.usdz"
        ar
        ar-modes="webxr scene-viewer quick-look"
        ar-scale="fixed"
        ar-placement="floor"
        scale="0.1 0.1 0.1"
        camera-controls
        touch-action="pan-y"
        auto-rotate
        shadow-intensity="1"
        alt="Panel Tales 1937 GMC Truck"
    >
        <button slot="ar-button" style="
            background: #fff;
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            cursor: pointer;
        ">
            📱 Ver en AR
        </button>
    </model-viewer>

    <p class="instructions">
        Rotá el modelo con el dedo. Tocá "Ver en AR" para colocarlo en tu espacio.<br>
        En AR: un dedo para mover, dos dedos para rotar y escalar (pinch).
    </p>
</body>
</html>
